<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SilkWay — Manual Review</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --ink: #1c2024; --muted: #6b7280;
    --line: #e3e6ea; --accent: #2563eb; --accent-ink: #ffffff;
    --ok: #128a4a; --ok-bg: #e7f6ee; --warn: #9a6b00; --warn-bg: #fdf3e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a; --card: #1e2226; --ink: #eceef0; --muted: #9aa3ad;
      --line: #2c3238; --accent: #4b8bff; --accent-ink: #0b1220;
      --ok: #56d38a; --ok-bg: #10281c; --warn: #e6b450; --warn-bg: #2a2211;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--card);
    border-bottom: 1px solid var(--line); padding: 12px 16px;
    display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
  }
  header h1 { font-size: 16px; margin: 0 auto 0 0; font-weight: 650; }
  header .count { color: var(--muted); font-size: 13px; }
  input, button {
    font: inherit; border-radius: 8px; border: 1px solid var(--line);
    padding: 7px 10px; background: var(--bg); color: var(--ink);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  button {
    background: var(--accent); color: var(--accent-ink); border-color: transparent;
    cursor: pointer; font-weight: 600;
  }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }
  .msg { padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; }
  .msg.warn { background: var(--warn-bg); color: var(--warn); }
  .msg.ok { background: var(--ok-bg); color: var(--ok); }
  .empty { color: var(--muted); text-align: center; padding: 48px 0; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; margin-bottom: 14px; display: grid; gap: 14px;
    grid-template-columns: 220px 1fr;
  }
  @media (max-width: 640px) { .card { grid-template-columns: 1fr; } }
  .photo {
    width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 8px;
    background: var(--bg); border: 1px solid var(--line);
  }
  .photo.none {
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 13px; aspect-ratio: 3/4;
  }
  .meta { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .pid { font-weight: 650; }
  .tag {
    font-size: 12px; color: var(--muted); border: 1px solid var(--line);
    border-radius: 999px; padding: 2px 8px;
  }
  .reason { color: var(--muted); font-size: 13px; }
  .chip {
    background: transparent; color: var(--accent); border: 1px solid var(--accent);
    border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 600;
  }
  .idrow input { width: 160px; font-size: 17px; letter-spacing: 1px; font-weight: 650; }
  details { font-size: 13px; color: var(--muted); }
  details pre {
    white-space: pre-wrap; word-break: break-word; background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin: 8px 0 0;
    max-height: 220px; overflow: auto; color: var(--ink);
  }
  .cardmsg { font-size: 13px; }
  .cardmsg.warn { color: var(--warn); }
</style>
</head>
<body>
<header>
  <h1>SilkWay — Manual Review</h1>
  <span class="count" id="count"></span>
  <input id="name" placeholder="your name" size="10" />
  <input id="token" placeholder="access token" type="password" size="14" />
  <button id="reload">Load queue</button>
</header>
<main>
  <div id="msg"></div>
  <div id="list"></div>
</main>

<script>
// --- tiny state, persisted so a specialist re-opens where they left off ---------
const $ = (id) => document.getElementById(id);
const store = {
  get token() { return localStorage.getItem("sw_token") || ""; },
  set token(v) { localStorage.setItem("sw_token", v); },
  get name() { return localStorage.getItem("sw_name") || ""; },
  set name(v) { localStorage.setItem("sw_name", v); },
};
$("token").value = store.token;
$("name").value = store.name;

function setMsg(text, kind) {
  $("msg").innerHTML = text ? `<div class="msg ${kind||''}">${text}</div>` : "";
}

// send the bearer token with every api call; the page itself is served open.
function authHeaders(extra) {
  const h = extra || {};
  if (store.token) h["Authorization"] = "Bearer " + store.token;
  return h;
}

async function loadQueue() {
  store.token = $("token").value.trim();
  store.name = $("name").value.trim();
  setMsg("Loading…");
  let resp;
  try {
    resp = await fetch("manual-queue", { headers: authHeaders() });
  } catch (e) {
    setMsg("Network error: " + e.message, "warn");
    return;
  }
  if (resp.status === 401) { setMsg("Access denied — check your token.", "warn"); return; }
  if (!resp.ok) { setMsg("Error " + resp.status, "warn"); return; }
  const data = await resp.json();
  render(data.pending || []);
  setMsg("");
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function render(items) {
  $("count").textContent = items.length + " pending";
  const list = $("list");
  if (!items.length) { list.innerHTML = `<div class="empty">Nothing to review 🎉</div>`; return; }
  list.innerHTML = "";
  for (const it of items) list.appendChild(card(it));
}

function card(it) {
  const el = document.createElement("div");
  el.className = "card";

  const photo = it.image_url
    ? `<img class="photo" src="${esc(it.image_url)}" alt="parcel ${esc(it.parcel_id)}" loading="lazy" />`
    : `<div class="photo none">no photo url</div>`;

  const chips = (it.candidates || [])
    .map((c) => `<button class="chip" data-fill="${esc(c)}">${esc(c)}</button>`)
    .join("");

  const transcript = it.transcript
    ? `<details><summary>OCR transcript</summary><pre>${esc(it.transcript)}</pre></details>`
    : "";

  el.innerHTML = `
    ${photo}
    <div class="meta">
      <div class="row">
        <span class="pid">Parcel ${esc(it.parcel_id)}</span>
        ${it.source ? `<span class="tag">${esc(it.source)}</span>` : ""}
        ${it.confidence ? `<span class="tag">${esc(it.confidence)}</span>` : ""}
      </div>
      ${it.reason ? `<div class="reason">${esc(it.reason)}</div>` : ""}
      ${chips ? `<div class="row">${chips}</div>` : ""}
      <div class="row idrow">
        <input value="${esc(it.prefill_member_id || "")}" placeholder="member_id"
               inputmode="numeric" />
        <button data-confirm>Confirm</button>
        <span class="cardmsg"></span>
      </div>
      ${transcript}
    </div>`;

  const input = el.querySelector(".idrow input");
  const cardmsg = el.querySelector(".cardmsg");
  el.querySelectorAll(".chip").forEach((ch) =>
    ch.addEventListener("click", () => { input.value = ch.dataset.fill; input.focus(); }));

  el.querySelector("[data-confirm]").addEventListener("click", async (ev) => {
    const member_id = input.value.trim();
    if (!/^\d{5,7}$/.test(member_id)) { cardmsg.textContent = "enter a 5–7 digit id"; cardmsg.className = "cardmsg warn"; return; }
    ev.target.disabled = true; cardmsg.textContent = "saving…"; cardmsg.className = "cardmsg";
    const body = new URLSearchParams({ member_id });
    if (store.name) body.set("resolved_by", store.name);
    let resp;
    try {
      resp = await fetch(`manual-queue/${it.id}/resolve`, { method: "POST", headers: authHeaders(), body });
    } catch (e) { cardmsg.textContent = "network error"; cardmsg.className = "cardmsg warn"; ev.target.disabled = false; return; }
    if (resp.ok) {
      el.style.transition = "opacity .25s"; el.style.opacity = "0";
      setTimeout(() => { el.remove();
        const n = document.querySelectorAll(".card").length;
        $("count").textContent = n + " pending";
        if (!n) $("list").innerHTML = `<div class="empty">Nothing to review 🎉</div>`;
      }, 250);
    } else if (resp.status === 401) {
      cardmsg.textContent = "access denied"; cardmsg.className = "cardmsg warn"; ev.target.disabled = false;
    } else if (resp.status === 404) {
      cardmsg.textContent = "already resolved"; cardmsg.className = "cardmsg warn"; ev.target.disabled = false;
    } else {
      cardmsg.textContent = "error " + resp.status; cardmsg.className = "cardmsg warn"; ev.target.disabled = false;
    }
  });

  return el;
}

$("reload").addEventListener("click", loadQueue);
if (store.token) loadQueue();
</script>
</body>
</html>
