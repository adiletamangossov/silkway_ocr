<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SilkWay — Manual Review</title>
<style>
  :root {
    --bg: #eef1f5; --surface: #ffffff; --surface-2: #f6f8fb;
    --ink: #171b21; --muted: #5b6572; --line: #dde2e8;
    --accent: #2f6df0; --accent-ink: #ffffff; --accent-soft: #e7eefc;
    --ok: #0f7a44; --ok-bg: #e4f5ec; --warn: #93670a; --warn-bg: #fbeecf;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
    --shadow: 0 1px 2px rgba(20,28,40,.06), 0 6px 20px rgba(20,28,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --surface: #171b21; --surface-2: #1c222a;
      --ink: #e7eaee; --muted: #939ca8; --line: #262c34;
      --accent: #5b93ff; --accent-ink: #0a0f18; --accent-soft: #17263f;
      --ok: #56d38a; --ok-bg: #0f261b; --warn: #e6b450; --warn-bg: #2a2211;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 26px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="light"] {
    --bg: #eef1f5; --surface: #ffffff; --surface-2: #f6f8fb;
    --ink: #171b21; --muted: #5b6572; --line: #dde2e8;
    --accent: #2f6df0; --accent-ink: #ffffff; --accent-soft: #e7eefc;
    --ok: #0f7a44; --ok-bg: #e4f5ec; --warn: #93670a; --warn-bg: #fbeecf;
    --shadow: 0 1px 2px rgba(20,28,40,.06), 0 6px 20px rgba(20,28,40,.06);
  }
  :root[data-theme="dark"] {
    --bg: #0f1216; --surface: #171b21; --surface-2: #1c222a;
    --ink: #e7eaee; --muted: #939ca8; --line: #262c34;
    --accent: #5b93ff; --accent-ink: #0a0f18; --accent-soft: #17263f;
    --ok: #56d38a; --ok-bg: #0f261b; --warn: #e6b450; --warn-bg: #2a2211;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 26px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .tnum { font-variant-numeric: tabular-nums; }

  header {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--surface) 90%, transparent);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
    padding: 11px 18px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center;
  }
  .brand { display: flex; align-items: baseline; gap: 9px; margin-right: auto; }
  .brand b { font-size: 15px; font-weight: 680; letter-spacing: .2px; }
  .brand .sub { font-size: 11px; letter-spacing: .13em; text-transform: uppercase; color: var(--muted); }
  .count {
    font: 600 12px/1 var(--mono); color: var(--accent); background: var(--accent-soft);
    border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent);
    padding: 5px 9px; border-radius: 999px; font-variant-numeric: tabular-nums;
  }
  .field {
    display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 9px; padding: 6px 9px;
  }
  .field label { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .field input { border: 0; background: transparent; color: var(--ink); font: inherit; width: 100px; outline: none; }
  button {
    font: inherit; cursor: pointer; border-radius: 9px; border: 1px solid transparent;
    background: var(--accent); color: var(--accent-ink); font-weight: 600; padding: 8px 13px;
  }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: default; }

  main { max-width: 940px; margin: 0 auto; padding: 22px 18px 64px; }
  .intro { color: var(--muted); font-size: 13.5px; margin: 2px 2px 18px; max-width: 62ch; }
  .msg { padding: 10px 12px; border-radius: 9px; margin-bottom: 14px; font-size: 14px; }
  .msg.warn { background: var(--warn-bg); color: var(--warn); }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 15px; margin-bottom: 15px;
    display: grid; grid-template-columns: 208px 1fr; gap: 16px;
    transition: opacity .28s ease, transform .28s ease;
  }
  @media (max-width: 620px) { .card { grid-template-columns: 1fr; } }
  .card.done { opacity: 0; transform: translateY(-6px); }

  .label { width: 100%; aspect-ratio: 3 / 4; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); }
  .label img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .label svg { display: block; width: 100%; height: 100%; }

  .meta { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .toprow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .pid { font: 650 15px/1 system-ui; }
  .pid span { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .tag { font: 500 11.5px/1 var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 4px 7px; letter-spacing: .02em; }
  .tag.src { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 34%, transparent); background: var(--accent-soft); }
  .reason { color: var(--muted); font-size: 13px; }

  .eyebrow { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    font: 600 14px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--accent);
    background: transparent; border: 1px dashed color-mix(in srgb, var(--accent) 50%, transparent);
    border-radius: 8px; padding: 6px 10px;
  }
  .chip:hover { background: var(--accent-soft); border-style: solid; }

  .resolve { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; }
  .idbox { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 10px; padding: 4px 6px 4px 12px; }
  .idbox:focus-within { border-color: var(--accent); }
  .idbox .pfx { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .idbox input {
    border: 0; background: transparent; color: var(--ink); outline: none; width: 122px;
    font: 700 20px/1 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: 2px;
  }
  .note { font-size: 12.5px; color: var(--muted); min-height: 1.2em; }
  .note.bad { color: var(--warn); }
  .note.good { color: var(--ok); }

  details { border-top: 1px solid var(--line); padding-top: 10px; }
  summary { cursor: pointer; font-size: 12px; color: var(--muted); letter-spacing: .04em; list-style: none; display: inline-flex; align-items: center; gap: 6px; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "›"; transition: transform .15s; display: inline-block; }
  details[open] summary::before { transform: rotate(90deg); }
  details pre {
    margin: 10px 0 0; padding: 11px 12px; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 9px; color: var(--ink); font: 12.5px/1.5 var(--mono); white-space: pre-wrap;
    word-break: break-word; max-height: 190px; overflow: auto;
  }
  .empty { text-align: center; color: var(--muted); padding: 60px 0 20px; }
  .empty .big { font-size: 34px; margin-bottom: 8px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="brand"><b>SilkWay</b><span class="sub">Manual Review</span></div>
  <span class="count tnum" id="count"></span>
  <div class="field"><label for="name">Reviewer</label><input id="name" placeholder="your name" /></div>
  <div class="field"><label for="token">Token</label><input id="token" type="password" placeholder="access token" /></div>
  <button class="ghost" id="reload">Load queue</button>
</header>
<main>
  <p class="intro">
    Parcels the reader auto-accepted are already filed. These are the ones it wasn't
    sure of — confirm the member&nbsp;ID against the sticker and it's written to the parcel.
  </p>
  <div id="msg"></div>
  <div id="list"></div>
</main>

<script>
// --- persisted state, so a reviewer re-opens where they left off ----------------
const $ = (s, r = document) => r.querySelector(s);
const store = {
  get token() { return localStorage.getItem("sw_token") || ""; },
  set token(v) { localStorage.setItem("sw_token", v); },
  get name() { return localStorage.getItem("sw_name") || ""; },
  set name(v) { localStorage.setItem("sw_name", v); },
};
$("#token").value = store.token;
$("#name").value = store.name;

const setMsg = (t, k) => { $("#msg").innerHTML = t ? `<div class="msg ${k || ""}">${t}</div>` : ""; };
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// send the bearer token with every api call; the page itself is served open.
function authHeaders(extra) {
  const h = extra || {};
  if (store.token) h["Authorization"] = "Bearer " + store.token;
  return h;
}

async function loadQueue() {
  store.token = $("#token").value.trim();
  store.name = $("#name").value.trim();
  setMsg("Loading…");
  let resp;
  try { resp = await fetch("manual-queue", { headers: authHeaders() }); }
  catch (e) { setMsg("Network error: " + esc(e.message), "warn"); return; }
  if (resp.status === 401) { setMsg("Access denied — check your token.", "warn"); return; }
  if (!resp.ok) { setMsg("Error " + resp.status, "warn"); return; }
  const data = await resp.json();
  render(data.pending || []);
  setMsg("");
}

function render(items) {
  $("#count").textContent = items.length + " pending";
  const list = $("#list");
  if (!items.length) { list.innerHTML = `<div class="empty"><div class="big">✓</div>Queue clear — every parcel is filed.</div>`; return; }
  list.innerHTML = "";
  for (const it of items) list.appendChild(card(it));
}

// when a parcel has no photo url (or the cdn has purged it — old urls 404), draw a
// label-shaped panel from the real OCR transcript instead of a broken image, with
// the pre-filled id highlighted so the reviewer still has context at a glance.
function fallbackSVG(it) {
  const bars = Array.from({ length: 32 }, (_, i) => {
    const w = [1, 1, 2, 3][(i * 7) % 4], x = 16 + i * 5.7;
    return `<rect x="${x}" y="44" width="${w}" height="30" fill="var(--muted)" opacity=".5"/>`;
  }).join("");
  const pf = (it.prefill_member_id || "").trim();
  const lines = String(it.transcript || "")
    .split(/\r?\n/).map((l) => l.trim()).filter(Boolean).slice(0, 7)
    .map((l, i) => {
      const t = l.length > 27 ? l.slice(0, 26) + "…" : l;
      const hot = pf && l.includes(pf);
      return `<text x="14" y="${100 + i * 17}" font-family="var(--mono, monospace)" font-size="9.5"
        fill="${hot ? "var(--accent)" : "var(--muted)"}" font-weight="${hot ? "700" : "400"}">${esc(t)}</text>`;
    }).join("");
  const body = lines || `<text x="14" y="120" font-family="system-ui" font-size="11" fill="var(--muted)">no photo · no transcript</text>`;
  return `
  <svg viewBox="0 0 208 277" role="img" aria-label="no photo for parcel ${esc(it.parcel_id)}">
    <rect width="208" height="277" fill="var(--surface)"/>
    <rect x="0" y="0" width="208" height="28" fill="var(--surface-2)"/>
    <text x="14" y="19" font-family="system-ui" font-size="10.5" font-weight="700" fill="var(--muted)"
      letter-spacing="1">OCR TEXT · NO PHOTO</text>
    ${bars}
    <line x1="14" y1="84" x2="194" y2="84" stroke="var(--line)"/>
    ${body}
  </svg>`;
}

function card(it) {
  const el = document.createElement("div");
  el.className = "card";

  const chips = (it.candidates || []).length
    ? `<div><div class="eyebrow">Candidates</div><div class="chips">${
        it.candidates.map((c) => `<button class="chip" data-fill="${esc(c)}">${esc(c)}</button>`).join("")}</div></div>`
    : "";
  const transcript = it.transcript
    ? `<details><summary>OCR transcript</summary><pre>${esc(it.transcript)}</pre></details>` : "";

  el.innerHTML = `
    <div class="label"></div>
    <div class="meta">
      <div class="toprow">
        <span class="pid">Parcel <span>${esc(it.parcel_id)}</span></span>
        ${it.source ? `<span class="tag src">${esc(it.source)}</span>` : ""}
        ${it.confidence ? `<span class="tag">confidence: ${esc(it.confidence)}</span>` : ""}
      </div>
      ${it.reason ? `<div class="reason">${esc(it.reason)}</div>` : ""}
      ${chips}
      <div>
        <div class="eyebrow">Member ID</div>
        <div class="resolve">
          <div class="idbox"><span class="pfx">ID</span><input class="tnum" inputmode="numeric"
            value="${esc(it.prefill_member_id || "")}" placeholder="——————"
            aria-label="member id for parcel ${esc(it.parcel_id)}" /></div>
          <button data-confirm>Confirm &amp; file</button>
          <span class="note"></span>
        </div>
      </div>
      ${transcript}
    </div>`;

  // photo: real image when we have a url, with a graceful fall back to the label
  // panel if it is missing or fails to load (purged cdn urls 404).
  const labelEl = $(".label", el);
  if (it.image_url) {
    const img = new Image();
    img.loading = "lazy";
    img.alt = "parcel " + it.parcel_id;
    img.onerror = () => { labelEl.innerHTML = fallbackSVG(it); };
    img.src = it.image_url;
    labelEl.appendChild(img);
  } else {
    labelEl.innerHTML = fallbackSVG(it);
  }

  const input = $(".idbox input", el), note = $(".note", el);
  el.querySelectorAll(".chip").forEach((ch) =>
    ch.addEventListener("click", () => { input.value = ch.dataset.fill; input.focus(); note.className = "note"; note.textContent = ""; }));

  $("[data-confirm]", el).addEventListener("click", async (ev) => {
    const member_id = input.value.trim();
    if (!/^\d{5,7}$/.test(member_id)) { note.className = "note bad"; note.textContent = "Enter the 5–7 digit ID from the sticker."; input.focus(); return; }
    ev.target.disabled = true; note.className = "note"; note.textContent = "saving…";
    const body = new URLSearchParams({ member_id });
    if (store.name) body.set("resolved_by", store.name);
    let resp;
    try { resp = await fetch(`manual-queue/${it.id}/resolve`, { method: "POST", headers: authHeaders(), body }); }
    catch (e) { note.className = "note bad"; note.textContent = "network error"; ev.target.disabled = false; return; }

    if (resp.ok) {
      note.className = "note good"; note.textContent = "Filed to parcel " + it.parcel_id + " ✓";
      el.classList.add("done");
      setTimeout(() => {
        el.remove();
        const n = document.querySelectorAll(".card").length;
        $("#count").textContent = n + " pending";
        if (!n) $("#list").innerHTML = `<div class="empty"><div class="big">✓</div>Queue clear — every parcel is filed.</div>`;
      }, 300);
    } else if (resp.status === 401) { note.className = "note bad"; note.textContent = "access denied"; ev.target.disabled = false; }
    else if (resp.status === 404) { note.className = "note bad"; note.textContent = "already resolved"; ev.target.disabled = false; }
    else { note.className = "note bad"; note.textContent = "error " + resp.status; ev.target.disabled = false; }
  });

  return el;
}

$("#reload").addEventListener("click", loadQueue);
if (store.token) loadQueue();
</script>
</body>
</html>
